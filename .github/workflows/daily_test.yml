name: Litemall接口自动化测试并发送邮件

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 北京时间 11:00

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装项目依赖
        run: |
          pip install pytest requests pytest-html

      - name: 4. 运行自动化测试
        continue-on-error: true
        run: |
          python -m pytest tests/ --html=report.html --self-contained-html --junitxml=result.xml

      - name: 5. 执行 Python 脚本发送邮件
        if: always()
        env:
          # 💡 确保 GitHub Settings -> Secrets 中这两个名字准确无误
          MAIL_USER: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
          RECEIVER: '1143568940@qq.com'
        run: |
          python - <<'EOF'
          import smtplib, os, sys, requests
          import xml.etree.ElementTree as ET
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.mime.application import MIMEApplication

          def get_rate():
              """从 comparisons 接口精准提取汇率"""
              try:
                  url = "https://wise.com/gateway/v4/comparisons"
                  params = {
                      "sourceCurrency": "MYR", "targetCurrency": "CNY",
                      "sendAmount": "1000", "sourceCountry": "CN",
                      "filter": "POPULAR", "includeWise": "true", "numberOfProviders": "3"
                  }
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                      "Content-Type": "application/json"
                  }
                  r = requests.get(url, params=params, headers=headers, timeout=15)
                  if r.status_code == 200:
                      data = r.json()
                      providers = data.get('providers', [])
                      for p in providers:
                          if p.get('alias') == 'wise':
                              rate = p.get('quotes', [{}])[0].get('rate')
                              return float(rate)
              except Exception as e:
                  print(f"Wise 接口解析异常: {e}")
              
              try:
                  r = requests.get("https://api.exchangerate-api.com/v4/latest/MYR", timeout=10)
                  return float(r.json()['rates']['CNY'])
              except:
                  return None

          def get_test_stats():
              try:
                  if not os.path.exists('result.xml'): 
                      print("未找到 result.xml, 将不显示测试统计")
                      return None
                  tree = ET.parse('result.xml')
                  root = tree.getroot()
                  ts = root if root.tag == 'testsuite' else root[0]
                  total = int(ts.get('tests', 0))
                  fail = int(ts.get('failures', 0))
                  return {
                      "total": total, "failures": fail,
                      "passed": total - fail - int(ts.get('skipped', 0))
                  }
              except Exception as e:
                  print(f"解析统计数据异常: {e}")
                  return None

          def send():
              # 1. 变量检查
              sender = os.environ.get('MAIL_USER')
              password = os.environ.get('MAIL_PASS')
              receiver = os.environ.get('RECEIVER')
              
              if not sender or not password:
                  print("❌ 错误: 环境变量 MAIL_USER 或 MAIL_PASS 未配置！请检查 GitHub Secrets")
                  return

              # 2. 获取数据
              raw_rate = get_rate()
              if raw_rate is not None:
                  raw_rate_5f = "{:.5f}".format(raw_rate)
                  rate_index_text = "{:.2f}".format(raw_rate * 1000)
              else:
                  raw_rate_5f = "获取失败"
                  rate_index_text = "获取失败"

              stats = get_test_stats()
              
              # 3. 构造邮件
              msg = MIMEMultipart()
              msg['Subject'] = f"📊 测试报告 | 汇率指数: {rate_index_text}"
              msg['From'] = f"QA-Bot <{sender}>"
              msg['To'] = receiver

              color = "#28a745" if stats and int(stats['failures']) == 0 else "#dc3545"
              html = f"""
              <html><body>
                <h2 style="color: {color};">自动化测试执行完毕</h2>
                <h3 style="color: #007bff;">💱 汇率监控 (MYR -> CNY)</h3>
                <p style="font-size: 16px;">
                    原始汇率 (5位): <span style="color: #6c757d;">{raw_rate_5f}</span><br>
                    <b>汇率指数 (x1000): <span style="color: #e83e8c; font-size: 24px;">{rate_index_text}</span></b>
                </p>
              """
              if stats:
                  html += f"""
                  <h3 style="color: #007bff;">🧪 测试统计</h3>
                  <table border="1" style="border-collapse: collapse; text-align: center; width: 240px;">
                    <tr style="background-color: #f2f2f2;"><th>项目</th><th>数量</th></tr>
                    <tr><td>总用例</td><td>{stats['total']}</td></tr>
                    <tr style="color: green;"><td>通过</td><td>{stats['passed']}</td></tr>
                    <tr style="color: red;"><td>失败</td><td>{stats['failures']}</td></tr>
                  </table>
                  """
              html += "</body></html>"
              msg.attach(MIMEText(html, 'html'))

              # 4. 附件处理
              if os.path.exists("report.html"):
                  with open("report.html", "rb") as f:
                      part = MIMEApplication(f.read(), Name="report.html")
                      part.add_header('Content-Disposition', 'attachment', filename="report.html")
                      msg.attach(part)

              # 5. 发送
              try:
                  print(f"正在尝试发送邮件至 {receiver}...")
                  s = smtplib.SMTP_SSL("smtp.qq.com", 465)
                  s.login(sender, password)
                  s.sendmail(sender, [receiver], msg.as_string())
                  s.quit()
                  print("✅ 邮件发送成功！")
              except Exception as e:
                  print(f"❌ 邮件发送失败: {e}")

          if __name__ == "__main__":
              send()
          EOF